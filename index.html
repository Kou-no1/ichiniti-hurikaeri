<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>一日のふりかえり</title>
<style>
:root{--bg:#f4f7f6;--line:#cfd8d5;--accent:#2f6f62;--soft:#eaf4f1;--muted:#66736f;--ink:#1f2d2a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Yu Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif}
button,input,textarea{font:inherit}
.toolbar{position:sticky;top:0;z-index:10;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 14px;background:rgba(244,247,246,.97);border-bottom:1px solid var(--line)}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;background:#e7ecea}button.primary{background:var(--accent);color:#fff}.note{font-size:.82rem;color:var(--muted)}
.app{max-width:1380px;margin:auto;padding:18px}.editor{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px}.editor h2{margin:0 0 12px;font-size:1.08rem}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}.field{grid-column:span 3}.field.w12{grid-column:span 12}
label{display:block;font-size:.82rem;font-weight:800;color:#58645f;margin-bottom:5px}input,textarea{width:100%;border:1px solid #cbd4d1;border-radius:9px;padding:9px 10px;background:#fff}textarea{resize:vertical}
.schedule{display:grid;gap:8px}.row{display:grid;grid-template-columns:88px 145px 1.2fr 1fr;gap:8px;align-items:center}.slot{font-weight:900}.hint{font-size:.78rem;color:var(--muted);margin-top:8px}
.sheet-wrap{display:flex;justify-content:center}.sheet{width:297mm;min-height:210mm;background:#fff;padding:8mm 9mm;border:1px solid #dfe5e3;box-shadow:0 8px 28px rgba(20,35,30,.09)}
.sheet-header{display:grid;grid-template-columns:1.5fr .8fr .8fr;gap:8px;align-items:end;padding-bottom:7px;border-bottom:3px solid var(--accent)}
.title{font-size:24px;font-weight:900}.subtitle{font-size:10px;color:#68746f;margin-top:2px}.mini{min-height:38px;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px;display:flex;align-items:center;gap:6px}.mini b{font-size:12px;color:#66736f}
.top-row{display:grid;grid-template-columns:1.15fr 1.5fr;gap:8px;margin-top:8px}.name-box,.mission-box{border:1.5px solid var(--line);border-radius:9px;background:#fff}
.name-box{display:grid;grid-template-columns:120px 1fr;min-height:56px}.name-label{border-right:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}.name-write{display:flex;align-items:flex-end;padding:8px 12px}.name-line{width:100%;border-bottom:1.8px solid #7d8985;height:28px}
.mission-box{padding:7px 10px;min-height:56px;display:flex;flex-direction:column;justify-content:center}.mission-title{font-size:12px;font-weight:800;color:var(--accent);margin-bottom:4px}.mission-text{font-size:13px;line-height:1.4;white-space:pre-wrap}
.goal{margin-top:8px;border:2px solid #9ec9bd;background:#f7fbfa;border-radius:10px;padding:7px 10px}.goal b{font-size:14px;color:var(--accent)}.write-line{height:24px;border-bottom:1.4px dashed #aeb9b5;margin-top:4px}
table{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:8px}th,td{border:1.2px solid #aeb9b5;padding:6px 5px;vertical-align:middle;text-align:center}th{background:var(--soft);font-size:13px;font-weight:900;line-height:1.25}td{font-size:12px;line-height:1.3}
.c1{width:8%}.c2{width:13%}.c3{width:25%}.c4{width:21%}.c5{width:16%}.c6{width:17%}.plan{font-weight:800;font-size:13px;white-space:pre-wrap;display:flex;align-items:center;justify-content:center;min-height:42px}.teacher{white-space:pre-wrap;display:flex;align-items:center;justify-content:center;min-height:42px}
.checks{display:flex;flex-direction:column;gap:5px;align-items:center;justify-content:center}.checkline{display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;font-size:12px}.circle{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border:1.4px solid #7d8985;border-radius:50%;font-weight:900;font-size:10px}
.memo{height:56px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 16px,#cdd5d2 17px)}.lunch{margin-top:4px;font-size:10px;color:#495651;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.bottom{display:grid;grid-template-columns:1.1fr .5fr;gap:8px;margin-top:8px}.reflection,.selfbox{border:1.5px solid #aeb9b5;border-radius:9px;padding:7px}.reflection h3,.selfbox h3{font-size:14px;margin:0 0 5px;text-align:center}.ruled{height:86px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 19px,#bec8c4 20px)}
.bigrow{display:flex;justify-content:space-around;gap:6px;margin-top:10px}.choice{text-align:center;font-size:10px;font-weight:700}.big{width:33px;height:33px;border:1.6px solid #68746f;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;margin:auto auto 3px}.footer{margin-top:6px;text-align:right;font-size:10px;color:#73807b}
@media(max-width:1100px){.app{padding:10px}.field{grid-column:span 12}.row{grid-template-columns:78px 1fr}.row textarea{grid-column:1/-1}.sheet{width:100%;min-height:auto;padding:12px}.top-row{grid-template-columns:1fr}.sheet-header{grid-template-columns:1fr}.bottom{grid-template-columns:1fr}}
@media print{body{background:#fff}.no-print{display:none!important}.app{max-width:none;padding:0}.sheet-wrap{display:block}.sheet{width:100%;min-height:auto;padding:0;border:0;box-shadow:none}@page{size:A4 landscape;margin:7mm}}
</style>
</head>
<body>
<div class="toolbar no-print">
<button class="primary" id="printBtn">印刷 / PDF保存</button>
<button id="saveBtn">入力を保存</button>
<button id="resetBtn">今日の入力をリセット</button>
<span class="note">印刷時に部数をクラス人数分に設定できます。</span>
</div>
<div class="app">
<section class="editor no-print">
<h2>① 基本情報</h2>
<div class="grid">
<div class="field"><label>日付</label><input type="date" id="date"></div>
<div class="field"><label>学年</label><input id="grade" placeholder="例：5年"></div>
<div class="field"><label>組</label><input id="className" placeholder="例：1組"></div>
<div class="field"><label>担任</label><input id="teacher" placeholder="例：○○先生"></div>
<div class="field w12"><label>先生からの一言・ミッション</label><textarea id="teacherMessage" rows="2" placeholder="例：時間を見て行動しよう。友だちと協力して、気持ちよく1日を過ごそう。"></textarea></div>
</div></section>
<section class="editor no-print">
<h2>② 今日の学習・課題・注意事項</h2>
<div class="schedule" id="schedule"></div>
<div class="hint">教科・活動、やること、注意事項を入力すると、下の児童用シートに反映されます。</div>
</section>
<div class="sheet-wrap"><section class="sheet">
<div class="sheet-header">
<div><div class="title">一日のふりかえり</div><div class="subtitle">自分で考え、友だちと協力して、気持ちよく1日を過ごそう。</div></div>
<div class="mini"><b>日付</b><span id="outDate"></span></div>
<div class="mini"><b>クラス</b><span id="outClass"></span></div>
</div>
<div class="top-row">
<div class="name-box"><div class="name-label">名前</div><div class="name-write"><div class="name-line"></div></div></div>
<div class="mission-box"><div class="mission-title">先生からの一言・ミッション</div><div class="mission-text" id="outMessage"></div></div>
</div>
<div class="goal"><b>今日の自分の目標</b><div class="write-line"></div></div>
<table>
<thead><tr><th class="c1">時間</th><th class="c2">教科・活動</th><th class="c3">今日やること</th><th class="c4">先生からの注意</th><th class="c5">自分でチェック</th><th class="c6">ひとこと</th></tr></thead>
<tbody id="sheetRows"></tbody></table>
<div class="bottom">
<div class="reflection"><h3>日記・今日のふりかえり</h3><div class="ruled"></div></div>
<div class="selfbox"><h3>今日の自分は？</h3><div class="bigrow"><div class="choice"><div class="big">◎</div>よくできた</div><div class="choice"><div class="big">○</div>だいたい</div><div class="choice"><div class="big">△</div>次はがんばる</div></div></div>
</div>
<div class="footer">帰りにふりかえりを書いて、提出しましょう。</div>
</section></div></div>
<script>
const KEY="absence_day_reflection_v3";
const slots=[{id:"morning",label:"朝",subject:"朝の会"},{id:"p1",label:"1時間目",subject:""},{id:"p2",label:"2時間目",subject:""},{id:"p3",label:"3時間目",subject:""},{id:"p4",label:"4時間目",subject:""},{id:"lunch",label:"給食",subject:"給食"},{id:"cleaning",label:"掃除",subject:"掃除"},{id:"p5",label:"5時間目",subject:""},{id:"p6",label:"6時間目",subject:""}];
const ids=["date","grade","className","teacher","teacherMessage"];
const els=Object.fromEntries(ids.map(id=>[id,document.getElementById(id)]));
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
function build(){document.getElementById("schedule").innerHTML=slots.map(s=>`<div class="row"><div class="slot">${s.label}</div><input id="subject_${s.id}" placeholder="教科・活動" value="${esc(s.subject)}"><textarea id="task_${s.id}" rows="1" placeholder="課題・ページ・やること"></textarea><textarea id="note_${s.id}" rows="1" placeholder="注意事項・持ち物・進め方"></textarea></div>`).join("")}
function getData(){const schedule={};slots.forEach(s=>schedule[s.id]={subject:document.getElementById("subject_"+s.id).value,task:document.getElementById("task_"+s.id).value,note:document.getElementById("note_"+s.id).value});return{date:els.date.value,grade:els.grade.value,className:els.className.value,teacher:els.teacher.value,teacherMessage:els.teacherMessage.value,schedule}}
function save(){localStorage.setItem(KEY,JSON.stringify(getData()))}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||"null");if(!d)return;ids.forEach(id=>{if(d[id]!=null)els[id].value=d[id]});slots.forEach(s=>{const x=d.schedule?.[s.id]||{};document.getElementById("subject_"+s.id).value=x.subject||"";document.getElementById("task_"+s.id).value=x.task||"";document.getElementById("note_"+s.id).value=x.note||""})}catch(e){}}
function dateText(v){if(!v)return "";const d=new Date(v+"T00:00:00");return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`}
function render(){const d=getData();document.getElementById("outDate").textContent=dateText(d.date);document.getElementById("outClass").textContent=[d.grade,d.className].filter(Boolean).join(" ");document.getElementById("outMessage").textContent=d.teacherMessage||"";document.getElementById("sheetRows").innerHTML=slots.map(s=>{const x=d.schedule[s.id];return `<tr><td><b>${s.label}</b></td><td><div class="plan">${esc(x.subject)}</div></td><td><div class="teacher">${esc(x.task)}</div></td><td><div class="teacher">${esc(x.note)}</div>${s.id==="lunch"?'<div class="lunch"><span>□ 準備</span><span>□ 食べ方</span><span>□ 片付け</span></div>':""}</td><td><div class="checks"><div class="checkline"><span class="circle">◎</span> できた</div><div class="checkline"><span class="circle">○</span> だいたい</div><div class="checkline"><span class="circle">△</span> もう少し</div></div></td><td><div class="memo"></div></td></tr>`}).join("")}
build();if(!els.date.value)els.date.value=new Date().toISOString().slice(0,10);load();render();
document.querySelectorAll("input,textarea").forEach(x=>x.addEventListener("input",()=>{save();render()}));
document.getElementById("saveBtn").addEventListener("click",()=>{save();render()});
document.getElementById("printBtn").addEventListener("click",()=>{save();render();window.print()});
document.getElementById("resetBtn").addEventListener("click",()=>{if(confirm("今日の入力内容をリセットしますか？")){localStorage.removeItem(KEY);location.reload()}});
</script>
</body>
</html>
